name: Build signed preview

# A signed release build that goes nowhere: same toolchain, signing and checks
# as release.yml (including the F-Droid twin APK), but the APKs are only kept
# as a workflow artifact. No update manifest, no attestation, and no GitHub
# Release is created or touched.
#
# Trigger it by hand from the Actions tab, or with:
#   gh workflow run preview-signed.yml --ref <branch-or-tag>
# It always builds the ref the run itself is on.
#
# The signing key only exists in the `release` environment's secrets, which only
# `main` and `v*` tags can use: RELEASE_KEYSTORE_BASE64 (the .jks file, base64),
# RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD. Run on
# any other ref, Configure signing fails by design instead of signing with a
# wrong key. Unlike debug.yml, these APKs carry the production signature (no
# ".debug" suffix) and install over / replace the released app in place.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      # SHA-256 of the certificate every NewTube release has been signed with.
      EXPECTED_CERT: 2ef99d76edfad988ad17cdee8ba18c634e230fe1e3cb1fdc6cdb0249370a36c9
      NDK_VERSION: 21.0.6113669   # smarttubetv/build.gradle ndkVersion (strips the .so files)
      CMDLINE_TOOLS_VERSION: "23.0"   # profgen; F-Droid's recipe installs the same version
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # No Gradle cache on purpose: a signed build starts from nothing another run could have left.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # The runner's cmdline-tools/latest drifts with the image; the embedded ART profile has to
      # come from the same profgen F-Droid uses, or the F-Droid APK can't match.
      - name: Install the NDK and a fixed profgen
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmdline-tools;$CMDLINE_TOOLS_VERSION" > /dev/null
          profgen="$ANDROID_HOME/cmdline-tools/$CMDLINE_TOOLS_VERSION/bin/profgen"
          test -x "$profgen"
          echo "PROFGEN=$profgen" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The release environment has no RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the release APKs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileRelease -PprofgenPath="$PROFGEN"
          mkdir dist
          cp smarttubetv/build/outputs/renamed_apks/stmobileRelease/NewTube_*.apk dist/

      # From a clean build, as F-Droid's is, and without the J2V8 libs its recipe deletes.
      - name: Build the F-Droid APK
        run: |
          set -euo pipefail
          rm -rf SharedModules/j2v8/src/main/jniLibs MediaServiceCore/SharedModules/j2v8/src/main/jniLibs
          ./gradlew --no-daemon --stacktrace clean :smarttubetv:assembleStmobileRelease -Pfdroid -PprofgenPath="$PROFGEN"
          cp smarttubetv/build/outputs/renamed_apks/stmobileRelease/NewTube_*_fdroid_universal.apk dist/

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Check names, version and signature
        run: |
          set -euo pipefail
          ls -l dist
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            for apk in dist/*.apk; do
              case "$(basename "$apk")" in
                "NewTube_${version}_"*) ;;
                *) echo "::error::$(basename "$apk") doesn't match tag $TAG. Bump versionName first."; exit 1 ;;
              esac
            done
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/[0-9]* | sort -V | tail -1)/apksigner"
          echo "Using $apksigner"
          for apk in dist/*.apk; do
            out="$("$apksigner" verify --print-certs "$apk" 2>&1)" || { echo "$out"; echo "::error::apksigner rejected $(basename "$apk")."; exit 1; }
            certs="$(printf '%s\n' "$out" | grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $4}' | sort -u)"
            if [ "$certs" != "$EXPECTED_CERT" ]; then
              echo "$out"
              echo "::error::$(basename "$apk") is signed with '${certs}', not NewTube's certificate."
              exit 1
            fi
            echo "$(basename "$apk"): signed with NewTube's certificate"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS)

      # Also kept when a check fails, to see what was built. Nothing here is
      # published: no update manifest, no attestation, no GitHub Release.
      - name: Keep the APKs as a workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube-signed-${{ env.TAG || github.sha }}
          if-no-files-found: ignore
          path: dist/
          retention-days: 14
